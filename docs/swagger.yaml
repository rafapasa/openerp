host: localhost:8080
info:
  contact: {}
  description: API do sistema OpenERP.
  title: OpenERP API
  version: 0.1a
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica o usuário e retorna tokens JWT
      parameters:
      - description: Credenciais de login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Realiza o login do usuário
      tags:
      - Auth
  /auth/logout:
    post:
      description: Invalida a sessão do usuário
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Realiza o logout
      tags:
      - Auth
  /auth/me:
    get:
      description: Retorna os dados do usuário autenticado
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UsuarioInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retorna informações do usuário
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Usa o refresh token para gerar um novo access token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Renova o token de acesso
      tags:
      - Auth
  /entidades:
    get:
      description: Retorna uma lista paginada de entidades
      parameters:
      - default: 10
        description: Limite de registros
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset para paginação
        in: query
        name: offset
        type: integer
      - description: Filtrar por nome (razao social)
        in: query
        name: nome
        type: string
      - description: Filtrar por documento
        in: query
        name: documento
        type: string
      - description: Filtrar por tipo (1-Física, 2-Jurídica)
        in: query
        name: tipo_pessoa
        type: integer
      - description: Filtrar por situação (1-Ativo, 2-Inativo)
        in: query
        name: situacao
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EntidadeListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista entidades
      tags:
      - Entidades
    post:
      consumes:
      - application/json
      description: Cadastra uma nova entidade (cliente/fornecedor)
      parameters:
      - description: Dados da entidade
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.EntidadeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.EntidadeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cria uma nova entidade
      tags:
      - Entidades
  /entidades/{entidadeId}/contatos:
    get:
      description: Retorna todos os contatos de uma entidade
      parameters:
      - description: ID da entidade
        in: path
        name: entidadeId
        required: true
        type: integer
      - default: 10
        description: Limite de registros
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset para paginação
        in: query
        name: offset
        type: integer
      - description: Filtrar por tipo de contato
        in: query
        name: tipo
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EntidadeContatoListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista contatos de uma entidade
      tags:
      - EntidadeContatos
    post:
      consumes:
      - application/json
      description: Cadastra um novo contato para uma entidade
      parameters:
      - description: ID da entidade
        in: path
        name: entidadeId
        required: true
        type: integer
      - description: Dados do contato
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.EntidadeContatoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.EntidadeContatoResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cria um novo contato
      tags:
      - EntidadeContatos
  /entidades/{entidadeId}/contatos/{item}:
    delete:
      description: Realiza a exclusão lógica de um contato
      parameters:
      - description: ID da entidade
        in: path
        name: entidadeId
        required: true
        type: integer
      - description: ID do contato
        in: path
        name: item
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
