#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
   # COMANDO DE COMPILAÇÃO: gera o executável na pasta bin
  cmd = "go build -o ./bin/main.exe ./cmd/api/main.go "
  
  # ONDE ESTÁ O EXECUTÁVEL (caminho relativo)
  bin = "./bin/main.exe"
  
  # PONTO DE ENTRADA (como executar)
  entrypoint = ["./bin/main.exe"]
  
  # Os outros campos permanecem iguais
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
